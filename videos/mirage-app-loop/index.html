<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Mirage — Native Image Flow</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1200px;
        overflow: hidden;
        background: #f5f5f7;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1200px;
        overflow: hidden;
        background: #f5f5f7;
      }

      #product-stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f5f7;
        isolation: isolate;
      }

      .product-view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f5f7;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .product-view img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        image-rendering: auto;
      }

      #discover-view {
        z-index: 1;
        opacity: 1;
      }

      #detail-view {
        z-index: 2;
        opacity: 0;
      }

      #finder-view {
        z-index: 3;
        opacity: 0;
      }

      #cursor {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 20;
        width: 48px;
        height: 48px;
        opacity: 0;
        pointer-events: none;
        filter: drop-shadow(0 5px 6px rgba(23, 23, 23, 0.3));
        transform-origin: 5px 4px;
        will-change: transform, opacity;
      }

      #cursor svg {
        display: block;
        width: 48px;
        height: 48px;
      }

      #click-anchor {
        position: absolute;
        top: 343px;
        left: 545px;
        z-index: 19;
        width: 48px;
        height: 48px;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      #click-ring {
        display: block;
        width: 48px;
        height: 48px;
        border: 4px solid #1677ff;
        border-radius: 50%;
        opacity: 0;
        transform: scale(0.3);
        will-change: transform, opacity;
      }

    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7.2"
      data-fps="30"
      data-width="1920"
      data-height="1200"
    >
      <section id="product-stage">
        <div id="discover-view" class="product-view" data-layout-allow-overflow="true">
          <img
            id="discover-image"
            src="assets/mirage-discover-full.jpg"
            alt="Mirage Discover view"
          />
        </div>

        <div id="detail-view" class="product-view" data-layout-allow-overflow="true">
          <img
            id="detail-image"
            src="assets/mirage-image-detail.jpg"
            alt="Mirage source details view"
          />
        </div>

        <div id="finder-view" class="product-view" data-layout-allow-overflow="true">
          <img
            id="finder-image"
            src="assets/mirage-in-finder.jpg"
            alt="Mirage in Finder"
          />
        </div>

        <div id="cursor" data-layout-ignore="true">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path
              d="M5 4L39 26L24.5 28.5L17.5 43L5 4Z"
              fill="#fffdf8"
              stroke="#171717"
              stroke-width="3"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <div id="click-anchor" data-layout-ignore="true">
          <span id="click-ring"></span>
        </div>

      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const transitionView = (outgoing, incoming, at, direction = 1) => {
        tl.to(
          outgoing,
          {
            x: -22 * direction,
            opacity: 0,
            duration: 0.2,
            ease: "power2.in",
          },
          at,
        );
        tl.fromTo(
          incoming,
          { x: 60 * direction, scale: 1, opacity: 1 },
          {
            x: 0,
            scale: 1,
            opacity: 1,
            duration: 0.24,
            ease: "power3.out",
            immediateRender: false,
          },
          at,
        );
      };

      const returnToDiscover = (at) => {
        tl.set("#discover-view", { x: 0, scale: 1, opacity: 1 }, at);
        tl.set("#finder-view", { x: 0, opacity: 0 }, at);
      };

      tl.set("#cursor", { x: 1600, y: 720, opacity: 0, scale: 1 }, 0);

      tl.to("#cursor", { opacity: 1, duration: 0.14, ease: "power1.out" }, 0.66);
      tl.to(
        "#cursor",
        {
          x: 540,
          y: 339,
          duration: 0.82,
          ease: "power3.out",
        },
        0.72,
      );
      tl.to(
        "#cursor",
        {
          scale: 0.84,
          duration: 0.08,
          yoyo: true,
          repeat: 1,
          ease: "power2.in",
        },
        1.64,
      );
      tl.fromTo(
        "#click-ring",
        { scale: 0.3, opacity: 0.8 },
        {
          scale: 4.2,
          opacity: 0,
          duration: 0.62,
          ease: "power3.out",
          immediateRender: false,
        },
        1.64,
      );

      transitionView("#discover-view", "#detail-view", 1.84, 1);
      tl.to("#cursor", { opacity: 0, duration: 0.16, ease: "power2.in" }, 1.92);

      transitionView("#detail-view", "#finder-view", 4.08, 1);

      returnToDiscover(6.28);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
